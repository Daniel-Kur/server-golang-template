name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: false
      - name: Install pinned golangci-lint
        run: make install-lint
      - name: Run quality gate
        run: make check
      - run: git diff --exit-code
