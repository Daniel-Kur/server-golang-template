<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Reference</title>
  <link rel="stylesheet" href="/openapi/style.css">
  <script src="/openapi/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#operation-detail">Skip to endpoint</a>
  <header class="topbar">
    <a class="brand" href="/openapi"><span class="brand-icon" aria-hidden="true">{ }</span> API Reference <span class="version" id="version"></span></a>
    <a class="spec-link" href="/openapi/json" target="_blank" rel="noopener">OpenAPI JSON ↗</a>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-title">EXPLORE THE API</div>
      <label class="search"><span class="sr-only">Search endpoints</span><input id="search" type="search" placeholder="Search endpoints…" aria-label="Search endpoints"></label>
      <nav id="navigation" aria-label="API endpoints"></nav>
      <p id="status" class="muted" role="status">Loading endpoints…</p>
      <div class="sidebar-note">Live requests go to this server.<br>Changes made by requests are real.</div>
    </aside>
    <main id="operation-detail" tabindex="-1"><div class="empty-state">Loading your API reference…</div></main>
  </div>
  <noscript>Enable JavaScript to explore endpoints, or open the OpenAPI JSON specification.</noscript>
</body>
</html>
