version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - durationcheck
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - nolintlint
    - staticcheck
    - unused
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets: []

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
